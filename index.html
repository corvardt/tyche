<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/glyph.svg" />
    <!-- Saved to a home screen, iOS ignores the favicon and will screenshot the
         page unless it is handed one of these. It masks its own rounded corners,
         so this one is drawn square and full bleed with the lot held clear of
         the crop; rounding it here would round it twice and show void at the
         corners. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dedee0" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Tyche. Forty random Ethereum keypairs a roll, read against the chain."
    />
    <title>Tyche</title>
    <!-- The two weights the first screen is built from, fetched in parallel
         with the stylesheet that declares them rather than after it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-mono-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-mono-600-latin.woff2"
      crossorigin
    />
    <script>
      // Resolve the medium before first paint so the tube never flashes on
      // paper. The cookie is written on `.corvardt.com`, so a choice made on the
      // index or on any other project carries here and back again.
      (function () {
        var m = document.cookie.match(/(?:^|;\s*)corvardt-theme=(dark|light)/);
        var t = m ? m[1] : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;

        // The coating, for the same reason and one step further: it is this
        // instrument's alone, so it is in localStorage rather than the shared
        // cookie, and reading it here is what stops a chosen tube from
        // flashing grey on every load.
        try {
          var p = localStorage.getItem('palette');
          if (/^(white|oil|crimson|demon)$/.test(p || '')) {
            document.documentElement.dataset.palette = p;
          }
        } catch (e) {
          // Storage disabled; the grey tube is the right fallback.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
