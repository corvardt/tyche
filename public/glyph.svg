<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Squared, drawn as a path rather than set as type: nothing in this
       interface is rounded, and a favicon cannot count on a font being there.
       Same stroke, same 2.5..12.5 extent and same open ends as the unmod U, so
       the two read as siblings when the index lists this station next to the
       others. The two media apply here too, so the mark holds on either tab bar. -->
  <style>
    path { stroke: #c8c8cc; }
    @media (prefers-color-scheme: light) { path { stroke: #2a2a2e; } }
  </style>
  <path d="M4 3.5 H12 M8 3.5 V12.5" fill="none" stroke-width="2" />
</svg>
