<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The sheet at 16px: nine cells running off the edge, one of them the lot
       that fell. The tile is Keraunos', and it carries its own ground on
       purpose. A bare glyph has to guess the colour of the tab bar, and the
       only tool for that is a prefers-color-scheme query inside the SVG, which
       browsers resolve inconsistently for an icon and Safari has never been
       reliable about. A dark tile is legible against light chrome and dark
       chrome alike, and it is what the page looks like anyway.

       What the two instruments do not share is the ink. Keraunos draws a single
       arrival and is entitled to full white; this is the same tube once the
       decay rule has run, so the lot sits at rest ink and the field it fell
       into sits at 0.10, which composites to #232323 over the void. That is
       9.4:1 under the lot and still 1.26:1 above the ground, and the second
       number is the one that matters here: the field bleeds to the edge, so
       the cells are also what describes the corner radius. Any darker and they
       merge into the tile, the grid stops resolving, and what is left is one
       pale square floating on black. -->
  <defs>
    <radialGradient id="bloom" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2" />
      <stop offset="55%" stop-color="#fff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lot">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="tile">
      <rect width="32" height="32" rx="7" />
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0a0a0b" />

  <!-- Clipped to the tile, or the field squares off the corners the hairline
       below spends its whole existence establishing. -->
  <g clip-path="url(#tile)">
    <circle cx="16" cy="15" r="14" fill="url(#bloom)" />

    <!-- Eight that missed. Cells of 9.2 on a step of 11.4, so the outer ones
         are cut by the radius rather than stopping short of it. -->
    <g fill="#ffffff" fill-opacity="0.1">
      <rect x="0" y="0" width="9.2" height="9.2" />
      <rect x="11.4" y="0" width="9.2" height="9.2" />
      <rect x="0" y="11.4" width="9.2" height="9.2" />
      <rect x="11.4" y="11.4" width="9.2" height="9.2" />
      <rect x="22.8" y="11.4" width="9.2" height="9.2" />
      <rect x="0" y="22.8" width="9.2" height="9.2" />
      <rect x="11.4" y="22.8" width="9.2" height="9.2" />
      <rect x="22.8" y="22.8" width="9.2" height="9.2" />
    </g>

    <!-- The lot. Off-centre because a centred one reads as a target, something
         aimed at, and the whole subject is that nothing here can be aimed. -->
    <circle cx="27.4" cy="4.6" r="11.5" fill="url(#lot)" />
    <rect x="22.8" y="0" width="9.2" height="9.2" fill="#c8c8cc" />
  </g>

  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" />
</svg>
